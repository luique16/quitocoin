databases:
  - name: quitocoin-db
    plan: starter
    databaseName: quitocoin
    user: quitocoin

services:
  - type: redis
    name: quitocoin-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: quitocoin-api
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger/index.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quitocoin-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: quitocoin-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  - type: web
    name: quitocoin-web
    env: node
    plan: starter
    rootDir: public
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: quitocoin-api
          type: web
          property: host
      - key: NEXT_PUBLIC_MINING_DIFFICULTY
        value: 7
      - key: NODE_VERSION
        value: 20
