databases:
  - name: postgres-inst
    databaseName: appdb
    user: appuser
    region: oregon

services:
  - type: redis
    name: redis-inst
    region: oregon
    plan: free
    ipAllowList: []

  - type: web
    name: backend-go
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-inst
          property: internalConnectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-inst
          property: internalConnectionString
      - key: PORT
        value: "8080"

  - type: web
    name: frontend-next
    env: docker
    dockerfilePath: ./public/Dockerfile
    region: oregon
    dockerCommand: sh -c "npm start"
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: backend-go
          property: url
      - key: NEXT_PUBLIC_MINING_DIFFICULTY
        value: "7"
